<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AI Image Creator</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: Arial, sans-serif;
    }

    body {
      background: #0b0f19;
      color: white;
      min-height: 100vh;
    }

    header {
      padding: 20px;
      text-align: center;
      border-bottom: 1px solid #252b3a;
    }

    .logo {
      font-size: 24px;
      font-weight: bold;
    }

    .container {
      width: 92%;
      max-width: 700px;
      margin: 30px auto;
    }

    .hero {
      text-align: center;
      margin-bottom: 25px;
    }

    .hero h1 {
      font-size: 32px;
      margin-bottom: 10px;
    }

    .hero p {
      color: #aeb6c7;
    }

    .card {
      background: #151b29;
      border: 1px solid #252d40;
      border-radius: 18px;
      padding: 20px;
    }

    label {
      display: block;
      margin: 15px 0 8px;
      font-weight: bold;
    }

    textarea,
    select {
      width: 100%;
      background: #0d1320;
      color: white;
      border: 1px solid #30394d;
      border-radius: 12px;
      padding: 14px;
      font-size: 16px;
      outline: none;
    }

    textarea {
      min-height: 130px;
      resize: vertical;
    }

    textarea:focus,
    select:focus {
      border-color: #7c5cff;
    }

    .row {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
    }

    button {
      width: 100%;
      margin-top: 20px;
      padding: 15px;
      border: none;
      border-radius: 12px;
      background: #7c5cff;
      color: white;
      font-size: 17px;
      font-weight: bold;
      cursor: pointer;
    }

    button:disabled {
      opacity: 0.6;
    }

    .preview-title {
      margin: 30px 0 12px;
      font-size: 20px;
      font-weight: bold;
    }

    #preview {
      min-height: 180px;
      background: #111725;
      border: 1px dashed #384157;
      border-radius: 16px;
      display: flex;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 15px;
      overflow: hidden;
    }

    #preview img {
      width: 100%;
      height: auto;
      display: block;
      border-radius: 12px;
    }

    .loading {
      color: #b8c0d2;
    }

    .error {
      color: #ff8f8f;
    }

    .recent {
      margin-top: 30px;
    }

    .recent h2 {
      font-size: 20px;
      margin-bottom: 12px;
    }

    .empty {
      color: #8f98aa;
      background: #151b29;
      padding: 20px;
      border-radius: 14px;
      text-align: center;
    }

    @media (max-width: 500px) {
      .hero h1 {
        font-size: 27px;
      }

      .row {
        grid-template-columns: 1fr;
      }
    }
  </style>
</head>

<body>

  <header>
    <div class="logo">✨ AI Creator</div>
  </header>

  <main class="container">

    <section class="hero">
      <h1>AI Image Creator</h1>
      <p>Turn your imagination into amazing images.</p>
    </section>

    <section class="card">

      <label for="prompt">Describe your image</label>

      <textarea
        id="prompt"
        placeholder="Example: A futuristic city at sunset with flying cars..."
      ></textarea>

      <div class="row">

        <div>
          <label for="style">Style</label>
          <select id="style">
            <option value="Realistic">Realistic</option>
            <option value="Anime">Anime</option>
            <option value="Cartoon">Cartoon</option>
            <option value="3D">3D</option>
            <option value="Cinematic">Cinematic</option>
            <option value="Fantasy">Fantasy</option>
          </select>
        </div>

        <div>
          <label for="ratio">Ratio</label>
          <select id="ratio">
            <option value="1:1">1:1</option>
            <option value="16:9">16:9</option>
            <option value="9:16">9:16</option>
            <option value="4:3">4:3</option>
          </select>
        </div>

      </div>

      <button id="generateButton" onclick="generateImage()">
        🎨 Generate Image
      </button>

    </section>

    <div class="preview-title">Preview</div>

    <section id="preview">
      <p>🖼️ Your generated image will appear here.</p>
    </section>

    <section class="recent">
      <h2>Recent Creations</h2>
      <div class="empty">
        Your generated images will appear here.
      </div>
    </section>

  </main>

  <script>

    async function generateImage() {

      const promptBox = document.getElementById("prompt");
      const styleBox = document.getElementById("style");
      const ratioBox = document.getElementById("ratio");
      const preview = document.getElementById("preview");
      const button = document.getElementById("generateButton");

      const prompt = promptBox.value.trim();
      const style = styleBox.value;
      const ratio = ratioBox.value;

      if (!prompt) {
        alert("Please describe the image you want.");
        return;
      }

      button.disabled = true;
      button.textContent = "🎨 Creating image...";

      preview.innerHTML = `
        <p class="loading">✨ Creating your ${style.toLowerCase()} image...</p>
      `;

      try {

        const response = await fetch(
          "https://ai-image-appcreator.vercel.app/api/generate",
          {
            method: "POST",
            headers: {
              "Content-Type": "application/json"
            },
            body: JSON.stringify({
              prompt:
                `${prompt}. Style: ${style}. Aspect ratio: ${ratio}.`
            })
          }
        );

        const result = await response.json();

        if (!response.ok) {
          throw new Error(
            result.error || "Image generation failed."
          );
        }

        const image = result.data?.[0];

        if (!image) {
          throw new Error("No image was returned.");
        }

        let imageSrc = "";

        if (image.b64_json) {
          imageSrc =
            "data:image/png;base64," +
            image.b64_json;
        } else if (image.url) {
          imageSrc = image.url;
        } else {
          throw new Error("No image data was returned.");
        }

        preview.innerHTML = `
          <img
            src="${imageSrc}"
            alt="Generated AI image"
          >
        `;

      } catch (error) {

        console.error(error);

        preview.innerHTML = `
          <p class="error">
            ❌ ${error.message}
          </p>
        `;

      } finally {

        button.disabled = false;
        button.textContent = "🎨 Generate Image";

      }
    }

  </script>

</body>
</html>
